name: PipelineGuard UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: React lifecycle regression tests
        env:
          CI: 'true'
          DISABLE_EMERGENT_OVERLAY: 'true'
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        run: yarn test --watchAll=false --runInBand
      - name: Build frontend
        env:
          CI: 'false'
          DISABLE_EMERGENT_OVERLAY: 'true'
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        run: yarn build

  scanner-regressions:
    name: Local scanner precision tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run fixture precision and secret-cache regression tests
        env:
          PYTHONPATH: engine
        run: python -m pytest -q engine/tests/test_secret_fixture_precision.py engine/tests/test_v2_secret_cache.py

  backend-smoke:
    name: Python bridge smoke checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bridge and engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.110.1 uvicorn==0.25.0 'pydantic>=2.6.4,<3' python-dotenv httpx 'typer>=0.12' rich pytest
          # Test the same bundled engine tree packaged by the Windows installer.
      - name: Compile Python bridge
        run: python -m compileall -q backend
      - name: Test local storage and report tracking
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Check bridge startup and authentication
        env:
          PIPELINEGUARD_ENGINE_PATH: ${{ github.workspace }}/engine
          PYTHONPATH: ${{ github.workspace }}/backend
          PIPELINEGUARD_DESKTOP_MODE: '1'
          PIPELINEGUARD_TOKEN: ci-test-token
          CORS_ORIGINS: http://localhost:3000
          PIPELINEGUARD_DATA_DIR: ${{ runner.temp }}/pipelineguard-ci-data
        run: python backend/tests/smoke_bridge.py
      - name: Bridge API security regressions
        env:
          PIPELINEGUARD_ENGINE_PATH: ${{ github.workspace }}/engine
          PYTHONPATH: ${{ github.workspace }}/backend
          PIPELINEGUARD_DESKTOP_MODE: '1'
          PIPELINEGUARD_TOKEN: ci-test-token
          CORS_ORIGINS: http://localhost:3000
          PIPELINEGUARD_DATA_DIR: ${{ runner.temp }}/pipelineguard-ci-data
        run: python backend/tests/security_bridge.py
      - name: Offline scan and report integration
        env:
          PIPELINEGUARD_ENGINE_PATH: ${{ github.workspace }}/engine
          PYTHONPATH: ${{ github.workspace }}/backend
          PIPELINEGUARD_DESKTOP_MODE: '1'
          PIPELINEGUARD_TOKEN: ci-test-token
          CORS_ORIGINS: http://localhost:3000
          PIPELINEGUARD_DATA_DIR: ${{ runner.temp }}/pipelineguard-ci-data
        run: python backend/tests/integration_scan.py
